{% extends "base.html" %}
{% block page_title %}BMI Calculator{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-7"><div class="card border-0 shadow-sm"><div class="card-header bg-primary text-white"><h3 class="mb-0">BMI Calculator</h3></div><div class="card-body"><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Weight (kg)</label><input class="form-control" type="number" name="weight" min="1" step="0.1" required></div><div class="mb-3"><label class="form-label">Height (cm)</label><input class="form-control" type="number" name="height" min="1" step="0.1" required></div><button class="btn btn-primary">Calculate BMI</button></form>{% if bmi %}<div class="alert alert-info mt-4 mb-0">Your BMI is <strong>{{ bmi }}</strong> — {{ status }}</div>{% endif %}{% if error %}<div class="alert alert-danger mt-4 mb-0">{{ error }}</div>{% endif %}</div></div></div></div>{% endblock %}
