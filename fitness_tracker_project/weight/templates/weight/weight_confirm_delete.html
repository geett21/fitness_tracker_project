{% extends "base.html" %}
{% block page_title %}Delete Weight Entry{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h3>Delete weight entry?</h3><p class="text-muted">This will remove the {{ weight.weight }} kg entry from {{ weight.date }}.</p><form method="post">{% csrf_token %}<button class="btn btn-danger">Delete</button><a href="{% url 'weight_list' %}" class="btn btn-outline-secondary">Cancel</a></form></div></div></div></div>{% endblock %}
