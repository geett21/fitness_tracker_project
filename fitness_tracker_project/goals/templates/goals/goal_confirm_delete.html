{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h3>Delete Goal</h3>

    <p>Are you sure you want to delete this goal?</p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes Delete
        </button>

        <a href="{% url 'goal_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
