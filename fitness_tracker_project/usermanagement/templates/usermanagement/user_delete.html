<!DOCTYPE html>
<html>
<head>
    <title>Delete User</title>
</head>
<body>

<h2>Delete User</h2>

<p>Are you sure you want to delete <b>{{ user.username }}</b>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<br>

<a href="{% url 'user_list' %}">Cancel</a>

</body>
</html>
