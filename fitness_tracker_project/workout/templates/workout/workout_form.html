{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                🏋️ Add Workout
            </h3>
        </div>


        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Workout Name
                        </label>

                        {{ form.name }}
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Category
                        </label>

                        {{ form.category }}
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Duration (Minutes)
                        </label>

                        {{ form.duration }}
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Calories Burned
                        </label>

                        {{ form.calories_burned }}
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Date
                        </label>

                        {{ form.date }}
                    </div>


                </div>


                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    Save Workout
                </button>


                <a href="{% url 'workout_list' %}" 
                   class="btn btn-secondary">
                    Back
                </a>


            </form>


        </div>

    </div>

</div>


{% endblock %}
