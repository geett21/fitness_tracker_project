{% extends "base.html" %}
{% block page_title %}Workout Timer{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm overflow-hidden"><div class="card-header border-0 p-4 text-white" style="background:#06b6d4;"><h3 class="mb-1"><i class="bi bi-stopwatch me-2"></i>Workout Timer</h3><p class="mb-0 text-white-50">Stay focused, one second at a time.</p></div><div class="card-body text-center p-5"><div id="timer" class="display-1 fw-bold mb-4" style="color:#6366f1;">00:00</div><button class="btn btn-success m-1 px-4" onclick="startTimer()"><i class="bi bi-play-fill"></i> Start</button><button class="btn btn-warning m-1 px-4" onclick="pauseTimer()"><i class="bi bi-pause-fill"></i> Pause</button><button class="btn btn-danger m-1 px-4" onclick="resetTimer()"><i class="bi bi-arrow-clockwise"></i> Reset</button></div></div></div></div><script>let seconds=0;let timer=null;function updateTimer(){let min=Math.floor(seconds/60);let sec=seconds%60;document.getElementById('timer').innerHTML=String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0');}function startTimer(){if(timer===null){timer=setInterval(function(){seconds++;updateTimer();},1000);}}function pauseTimer(){clearInterval(timer);timer=null;}function resetTimer(){clearInterval(timer);timer=null;seconds=0;updateTimer();}</script>{% endblock %}
