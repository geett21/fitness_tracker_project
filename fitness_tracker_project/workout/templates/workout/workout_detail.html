{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Workout Details</h2>

<div class="card p-3">

<h4>{{ workout.name }}</h4>

<p>
Category:
{{ workout.category }}
</p>

<p>
Duration:
{{ workout.duration }} minutes
</p>

<p>
Calories Burned:
{{ workout.calories_burned }}
</p>

<p>
Date:
{{ workout.date }}
</p>

</div>

</div>

{% endblock %}
