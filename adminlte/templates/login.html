{% extends "base.html" %}

{% block title %}Login | FitTrack{% endblock %}
{% block page_title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header"><h2 class="card-title mb-0">Welcome back</h2></div>
      <div class="card-body">
        {% if error_message %}<div class="alert alert-danger" role="alert">{{ error_message }}</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="id_username">Username or email</label>
            <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="{% url 'password_reset' %}">Forgot password?</a>
            <a href="{% url 'register' %}">Create an account</a>
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
