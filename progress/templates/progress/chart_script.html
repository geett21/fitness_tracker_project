<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% if weight_values %}
<script>
const dates = {{ dates|safe }};
const weightValues = {{ weight_values|safe }};

const ctx = document.getElementById('weightChart');

if (ctx) {
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: dates,
            datasets: [{
                label: 'Weight (kg)',
                data: weightValues,
                borderWidth: 3,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.15)',
                pointBackgroundColor: '#2563eb',
                pointBorderColor: '#ffffff',
                pointRadius: 4,
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true
                }
            },
            scales: {
                y: {
                    beginAtZero: false,
                    title: {
                        display: true,
                        text: 'Weight (kg)'
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: 'Date'
                    }
                }
            }
        }
    });
}
</script>
{% endif %}
